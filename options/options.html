<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optTitle">Grilled Phish — trusted sites</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1><img src="../icons/icon-128.png" alt="" class="logo"> <span data-i18n="optH1">My trusted sites</span></h1>
    <p data-i18n-html="optIntro"></p>
    <p class="hint" data-i18n="optHint"></p>
    <p><a href="../learn/learn.html" target="_blank" data-i18n="optLearn"></a></p>

    <form id="add">
      <label for="site" data-i18n="optSiteLabel">Website address</label>
      <div class="row">
        <input id="site" type="text" data-i18n-placeholder="optPlaceholder" autocomplete="off" spellcheck="false">
        <button type="submit" data-i18n="optAdd">Add</button>
      </div>
      <div id="msg" role="status"></div>
    </form>

    <ul id="list"></ul>
    <p id="empty" class="hint" hidden data-i18n="optEmpty"></p>

    <h2 data-i18n="optAgeH"></h2>
    <p data-i18n="optAgeP"></p>
    <label class="check"><input id="ageCheck" type="checkbox"> <span data-i18n="optAgeCheck"></span></label>
    <select id="ageDays">
      <option value="7" data-i18n="optWeek">1 week</option>
      <option value="30" data-i18n="optMonth">1 month (recommended)</option>
      <option value="90" data-i18n="opt3Months">3 months</option>
    </select>
    <p class="hint" data-i18n-html="optAgePrivacy"></p>

    <h2 data-i18n="optDbH"></h2>
    <p data-i18n-html="optDbP"></p>
    <p id="listStatus" class="hint" data-i18n="popChecking">Loading…</p>
    <label class="check"><input id="autoUpdate" type="checkbox"> <span data-i18n="optAuto"></span></label>
    <button id="checkNow" type="button" class="secondary" data-i18n="optCheckNow"></button>
    <p class="hint" data-i18n="optSigned"></p>

    <section class="never">
      <h2 data-i18n="aboutH"></h2>
      <ul>
        <li data-i18n="aboutData"></li>
        <li data-i18n="aboutWrite"></li>
        <li data-i18n="aboutLinks"></li>
        <li data-i18n="aboutOff"></li>
      </ul>
      <p class="scam" data-i18n="aboutScam"></p>
      <p><span data-i18n="aboutSite"></span>
        <a href="https://github.com/giobinda/grilled-phish" target="_blank" rel="noopener noreferrer"><code>github.com/giobinda/grilled-phish</code></a></p>
    </section>
  </main>
  <script src="../lib/i18n-dom.js"></script>
  <script src="../lib/detector.js"></script>
  <script src="options.js"></script>
</body>
</html>
