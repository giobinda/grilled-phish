<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grilled Phish</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="status" class="status">
    <div id="icon" class="icon">…</div>
    <div id="headline" class="headline" data-i18n="popChecking">Checking…</div>
  </div>
  <div class="label" data-i18n="popOn">You are on:</div>
  <div id="domain" class="domain">—</div>
  <div id="known" class="age" hidden></div>
  <div id="age" class="age" hidden></div>
  <ul id="reasons"></ul>
  <p id="trustWarn" class="warn" hidden data-i18n="popTrustWarn"></p>
  <button id="trust" class="btn" hidden data-i18n="popTrust">✓ I trust this site</button>
  <button id="untrust" class="btn secondary" hidden data-i18n="popUntrust"></button>
  <button id="settings" class="btn link" data-i18n="popSettings">My trusted sites…</button>
  <button id="learn" class="btn link" data-i18n="popLearn">How to spot a scam (5-minute guide)</button>
  <p class="beta" data-i18n-html="betaNotice"></p>
  <p class="never" data-i18n="aboutScam"></p>
  <script src="../lib/rich-text.js"></script>
  <script src="../lib/i18n-dom.js"></script>
  <script src="../lib/detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
