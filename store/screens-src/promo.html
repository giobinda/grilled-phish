<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>promo</title>
<style>
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); display: flex; align-items: center; gap: calc(var(--h) * .09);
    padding: 0 calc(var(--h) * .14); box-sizing: border-box; overflow: hidden;
    background: linear-gradient(135deg, #1d2b44, #3a1010); color: #fff; font-family: system-ui, sans-serif; }
  img { width: calc(var(--h) * .42); height: auto; flex: none; }
  h1 { margin: 0; font-size: calc(var(--h) * .15); line-height: 1.05; }
  p { margin: calc(var(--h) * .04) 0 0; font-size: calc(var(--h) * .068); line-height: 1.3; color: #ffe1d6; }
  .demo { display: inline-block; margin-top: calc(var(--h) * .06); font: bold calc(var(--h) * .07) ui-monospace, monospace;
    background: rgba(255,0,0,.15); outline: calc(var(--h) * .012) solid #ff3b3b; outline-offset: 3px; border-radius: 4px;
    padding: 0 8px; text-decoration: line-through #ff3b3b; }
  .badge { font: bold calc(var(--h) * .05) system-ui; background: #d40000; padding: 2px 10px; border-radius: 6px; margin-left: 10px; vertical-align: middle; }
  .small .demo, .small .badge { display: none; }
</style></head>
<body>
  <img src="../../icons/icon.svg" alt="">
  <div>
    <h1>Grilled Phish</h1>
    <p>Blocks fake look-alike websites before you click.</p>
    <div><span class="demo">paypa1.com</span><span class="badge">⛔ Fake site — blocked</span></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.documentElement.style.setProperty('--w', q.get('w') + 'px');
    document.documentElement.style.setProperty('--h', q.get('h') + 'px');
    if (Number(q.get('w')) < 600) document.body.classList.add('small');
  </script>
</body></html>
