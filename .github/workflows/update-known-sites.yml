# Rebuilds data/known-sites.txt from the latest Tranco list every Monday and
# commits it if it changed. Extensions configured (Settings -> Well-known websites
# -> Advanced) with this file's raw URL pick up the new list within a week:
#   https://raw.githubusercontent.com/<you>/<repo>/main/data/known-sites.txt
name: Update well-known sites list

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build list
        run: node tools/build-known-sites.js --top 100000
      - name: Run tests
        run: node --test test/detector.test.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update well-known sites list"
          git push
