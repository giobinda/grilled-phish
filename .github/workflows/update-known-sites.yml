# Rebuilds data/known-sites.txt from the latest Tranco list every Monday and
# commits it if it changed. Extensions configured (Settings -> Well-known websites
# -> Advanced) with this file's raw URL pick up the new list within a week:
#   https://raw.githubusercontent.com/<you>/<repo>/main/data/known-sites.txt
name: Update well-known sites list

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: only this job can push, and only to this repo.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Third-party actions are pinned to exact commits (a moved tag can't inject code).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Build list
        run: node tools/build-known-sites.js --top 100000
      - name: Run tests
        run: node --test test/detector.test.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update well-known sites list"
          git push
