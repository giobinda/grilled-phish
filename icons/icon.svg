<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Grilled Phish: a fish on a round grill. Source for icon-*.png -->
  <defs>
    <clipPath id="grill"><circle cx="64" cy="64" r="55"/></clipPath>
    <clipPath id="body">
      <path d="M12 64 C 28 34, 74 28, 96 57 L 118 38 L 111 64 L 118 90 L 96 71 C 74 100, 28 94, 12 64 Z"/>
    </clipPath>
  </defs>
  <!-- grill: dark disk, hot orange rim, grate bars -->
  <circle cx="64" cy="64" r="60" fill="#26262c"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#ff7a1a" stroke-width="4"/>
  <g clip-path="url(#grill)" stroke="#44444d" stroke-width="7">
    <line x1="24" y1="0" x2="24" y2="128"/>
    <line x1="44" y1="0" x2="44" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="84" y1="0" x2="84" y2="128"/>
    <line x1="104" y1="0" x2="104" y2="128"/>
  </g>
  <!-- fish -->
  <path d="M12 64 C 28 34, 74 28, 96 57 L 118 38 L 111 64 L 118 90 L 96 71 C 74 100, 28 94, 12 64 Z"
        fill="#f6a23c" stroke="#5c2a08" stroke-width="4" stroke-linejoin="round"/>
  <!-- grill marks -->
  <g clip-path="url(#body)" stroke="#6e340d" stroke-width="7" stroke-linecap="round">
    <line x1="50" y1="30" x2="38" y2="98"/>
    <line x1="68" y1="30" x2="56" y2="98"/>
    <line x1="86" y1="30" x2="74" y2="98"/>
  </g>
  <!-- cartoon "done" eye -->
  <g stroke="#2a1404" stroke-width="4" stroke-linecap="round">
    <line x1="23" y1="53" x2="31" y2="61"/>
    <line x1="31" y1="53" x2="23" y2="61"/>
  </g>
</svg>
